services:
  rizal_database:
    image: postgres:16-alpine
    container_name: rizal_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: rizal
      POSTGRES_PASSWORD: rizal
      POSTGRES_DB: rizal
    volumes:
      - rizal_db_data:/var/lib/postgresql/data
    networks:
      - rizal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizal -d rizal"]
      interval: 10s
      timeout: 5s
      retries: 5

  rizal_app:
    build: .
    container_name: rizal_app
    restart: unless-stopped
    depends_on:
      rizal_database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rizal:rizal@rizal_database:5432/rizal?sslmode=disable
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://rizal.click}
      NEXT_PUBLIC_WHATSAPP_PHONE: ${NEXT_PUBLIC_WHATSAPP_PHONE:-212600000000}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE:-}
      GA4_API_SECRET: ${GA4_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SALES_NOTIFY_EMAIL: ${SALES_NOTIFY_EMAIL:-contact@rizal.click}
      SHEETS_WEBHOOK_URL: ${SHEETS_WEBHOOK_URL:-}
      SHEETS_WEBHOOK_SECRET: ${SHEETS_WEBHOOK_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://rizal.click}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-changeme}
    ports:
      - "3000:3000"
    networks:
      - rizal_net
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]

networks:
  rizal_net:
    driver: bridge

volumes:
  rizal_db_data:
